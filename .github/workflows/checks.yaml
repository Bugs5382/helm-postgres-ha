name: Checks
# The repository's own checks, in two required jobs:
#   - 🧪 Checks, on every PR (a few minutes): helm lint and template,
#     kubeconform, the values schema and unit tests, helm-docs, promtool and
#     the release pin test. Go lint and tests run in their own workflows.
#   - 🧪 E2E: the agent image build, the real-PostgreSQL tests and the kind
#     suites (failover, backup with point-in-time restore, every runbook
#     command, major upgrade). On a PR it runs only with the e2e label or when
#     the PR changes the agent, the chart, the e2e tests, the Dockerfile, the
#     Go modules or this workflow; otherwise it is skipped, which counts as
#     passing. It always runs on pushes to main, nightly, on a published
#     release and on manual dispatch.
# Every tool is a pinned release checked against its published SHA-256.
#
# Pull requests skip drafts. The e2e label is read on the next push (or
# ready for review). Label events do not trigger a run: one raised while the
# PR was a draft cancels the real run and skips every job.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  release:
    types: [published]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  HELM_VERSION: v4.2.0
  HELM_SHA256: 97dbeb971be4ac4b27e3839976d9564c0fb35c6f3b1da89dd1e292d236af4096
  KUBECONFORM_VERSION: v0.8.0
  KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
  PROMETHEUS_VERSION: 3.15.0
  PROMETHEUS_SHA256: 2a542df32eac02ee17b9d844fb2aa1de00dafa5476579ba8a3ba862e9d572ea0
  HELM_DOCS_VERSION: 1.14.2
  HELM_DOCS_SHA256: a8cf72ada34fad93285ba2a452b38bdc5bd52cc9a571236244ec31022928d6cc
  HELM_UNITTEST_VERSION: 1.2.1
  HELM_UNITTEST_SHA256: 48e86ecc1467b009630e5954375e5d8494139f73b466df5fe8c04fa45b634939
  KIND_VERSION: v0.33.0
  KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
  # kind v0.33.0's default node image, pinned so the image cache key is exact.
  KIND_NODE_IMAGE: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
  CERT_MANAGER_VERSION: v1.21.2
  CERT_MANAGER_SHA256: e03b668ec8675214af6b0a671699d088f2601fa3878e0dbe1b41d3feafd1879f
jobs:
  changes:
    name: 🔍 E2E scope
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      e2e: ${{ steps.e2e.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: 🔍 Decide whether the e2e suites run
        id: e2e
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'e2e') }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then files=$(git diff --name-only "$BASE...$HEAD"); else files=""; fi
          out=$(printf '%s\n' "$files" | bash scripts/ci/e2e-scope.sh "$EVENT" "$LABELLED")
          printf '%s\n' "$out" >> "$GITHUB_OUTPUT"
          echo "E2E suites: ${out//$'\n'/; }" | tee -a "$GITHUB_STEP_SUMMARY"

  checks:
    name: 🧪 Checks
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: 🔧 Install the chart tools
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"; mkdir -p "$bin" "$RUNNER_TEMP/helm-plugins/helm-unittest"
          cd "$RUNNER_TEMP"
          curl -fsSLo helm.tgz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tgz" | sha256sum -c -
          tar -xzf helm.tgz --strip-components=1 -C "$bin" linux-amd64/helm
          curl -fsSLo kubeconform.tgz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tgz" | sha256sum -c -
          tar -xzf kubeconform.tgz -C "$bin" kubeconform
          curl -fsSLo unittest.tgz "https://github.com/helm-unittest/helm-unittest/releases/download/v${HELM_UNITTEST_VERSION}/helm-unittest-linux-amd64-${HELM_UNITTEST_VERSION}.tgz"
          echo "${HELM_UNITTEST_SHA256}  unittest.tgz" | sha256sum -c -
          tar -xzf unittest.tgz -C "$RUNNER_TEMP/helm-plugins/helm-unittest"
          curl -fsSLo prometheus.tgz "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          echo "${PROMETHEUS_SHA256}  prometheus.tgz" | sha256sum -c -
          tar -xzf prometheus.tgz --strip-components=1 -C "$bin" "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          curl -fsSLo helm-docs.tgz "https://github.com/norwoodj/helm-docs/releases/download/v${HELM_DOCS_VERSION}/helm-docs_${HELM_DOCS_VERSION}_Linux_x86_64.tar.gz"
          echo "${HELM_DOCS_SHA256}  helm-docs.tgz" | sha256sum -c -
          tar -xzf helm-docs.tgz -C "$bin" helm-docs
          echo "$bin" >> "$GITHUB_PATH"
          echo "HELM_PLUGINS=$RUNNER_TEMP/helm-plugins" >> "$GITHUB_ENV"

      - name: ⎈ Chart checks
        run: bash test/chart/checks.sh

  e2e:
    name: 🧪 E2E
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: 🐳 Build the agent image
        run: docker build -t ghcr.io/bugs5382/helm-postgres-ha/pgha:e2e --build-arg VERSION=e2e .

      - name: 🐹 Set up Go (module cache)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: 🐘 Agent tests against real PostgreSQL
        run: go test -tags integration -count=1 ./internal/pg/

      - name: 🔧 Install helm and kind
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"; mkdir -p "$bin"; cd "$RUNNER_TEMP"
          curl -fsSLo helm.tgz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tgz" | sha256sum -c -
          tar -xzf helm.tgz --strip-components=1 -C "$bin" linux-amd64/helm
          curl -fsSLo "$bin/kind" "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  $bin/kind" | sha256sum -c -
          chmod +x "$bin/kind"
          echo "$bin" >> "$GITHUB_PATH"

      - name: 💽 Cache the kind node image
        id: node-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/kind-node.tar
          key: kind-node-${{ env.KIND_NODE_IMAGE }}

      - name: 📦 Create the kind cluster
        env:
          CACHED: ${{ steps.node-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          tar="$RUNNER_TEMP/kind-node.tar"
          if [ "$CACHED" = "true" ]; then
            docker load -i "$tar"
          else
            docker pull "$KIND_NODE_IMAGE"
            docker save -o "$tar" "$KIND_NODE_IMAGE"
          fi
          kind create cluster --name pgha-e2e --image "$KIND_NODE_IMAGE" --config test/e2e/kind.yaml --wait 180s
          kind load docker-image ghcr.io/bugs5382/helm-postgres-ha/pgha:e2e --name pgha-e2e
          curl -fsSLo cert-manager.yaml "https://github.com/cert-manager/cert-manager/releases/download/${CERT_MANAGER_VERSION}/cert-manager.yaml"
          echo "${CERT_MANAGER_SHA256}  cert-manager.yaml" | sha256sum -c -
          kubectl apply -f cert-manager.yaml
          kubectl -n cert-manager rollout status deploy/cert-manager-webhook --timeout=180s

      - name: 🔁 Failover tests
        run: bash test/e2e/install.sh && bash test/e2e/run.sh

      - name: 💾 Backup and restore tests
        run: bash test/e2e/backup.sh

      - name: 📖 Runbook commands
        run: bash test/e2e/runbooks.sh

      - name: ⬆️ Major-version upgrade test
        run: bash test/e2e/upgrade.sh

      - name: 🧾 Cluster state on failure
        if: failure()
        run: |
          for ns in db bk rs restore up-old up-new; do
            kubectl -n "$ns" get pods,lease -o wide || true
            for p in $(kubectl -n "$ns" get pods -o name 2>/dev/null); do
              echo "--- $ns $p"; kubectl -n "$ns" logs "$p" --all-containers --tail=200 || true
            done
          done
