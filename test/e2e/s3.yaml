# A single-node SeaweedFS with its S3 gateway, standing in for object storage.
apiVersion: v1
kind: Secret
metadata:
  name: s3-config
stringData:
  s3.json: |
    {"identities":[{"name":"e2e","credentials":[{"accessKey":"e2e-access","secretKey":"e2e-secret-key"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      containers:
        - name: seaweedfs
          image: docker.io/chrislusf/seaweedfs:3.97@sha256:bb05d66d2963b1cc48073190781c3dd29e2c4c88a2ae2986bf58e38c86d89c6e
          args: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-master.volumeSizeLimitMB=256", "-volume.max=32"]
          ports:
            - containerPort: 8333
            - containerPort: 9333
          readinessProbe:
            tcpSocket:
              port: 8333
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/seaweedfs
      volumes:
        - name: data
          emptyDir: {}
        - name: config
          secret:
            secretName: s3-config
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
spec:
  selector:
    app: seaweedfs
  ports:
    - name: s3
      port: 8333
    - name: master
      port: 9333
