{{- $name := include "pgha.name" . -}}
{{- $users := include "pgha.usernames" . | fromJson -}}
{{- $items := list -}}
{{- range $c := include "pgha.credentialNames" . | fromJsonArray }}
{{- if not (index $.Values.credentials $c).existingSecret }}
{{- $items = append $items (dict "name" (printf "%s-%s" $name $c) "username" (index $users $c) "labels" (fromYaml (include "pgha.selectorLabels" $))) }}
{{- end }}
{{- end }}
{{- range .Values.roles }}
{{- if not .existingSecret }}
{{- $items = append $items (dict "name" (printf "%s-role-%s" $name .name) "username" .name "labels" (fromYaml (include "pgha.selectorLabels" $))) }}
{{- end }}
{{- end }}
{{- if $items }}
# Generated credentials are created once, before anything that mounts them,
# and never rewritten: the hook Job skips a Secret that already exists. This
# keeps passwords stable under GitOps tools that render without cluster
# access, where a lookup-based template would generate new ones every sync.
# The Secrets are not part of the release, so an uninstall keeps them along
# with the volumes they match.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pgha.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pgha.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames:
      {{- range $items }}
      - {{ .name | quote }}
      {{- end }}
    verbs: [get]
  # Create cannot be limited by name; the Job only creates the names above.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pgha.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-secrets
subjects:
  - kind: ServiceAccount
    name: {{ $name }}-secrets
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pgha.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
data:
  secrets.json: {{ dict "items" $items | toJson | quote }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pgha.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-ha-secrets
        app.kubernetes.io/instance: {{ $name }}
    spec:
      serviceAccountName: {{ $name }}-secrets
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: secrets
          image: {{ include "pgha.agentImage" . }}
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          args: ["secrets", "ensure", "--spec", "/etc/pgha/secrets.json"]
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: LOG_LEVEL
              value: {{ .Values.agent.logLevel | quote }}
            - name: LOG_FORMAT
              value: {{ .Values.agent.logFormat | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.agent.initResources | nindent 12 }}
          volumeMounts:
            - name: spec
              mountPath: /etc/pgha
              readOnly: true
      volumes:
        - name: spec
          configMap:
            name: {{ $name }}-secrets
{{- end }}
