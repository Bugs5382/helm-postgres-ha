{{- $name := include "pgha.name" . -}}
{{- $owned := include "pgha.ownedSettings" . | fromJsonArray -}}
{{- range $k, $_ := .Values.postgresql.parameters }}
{{- if has $k $owned }}{{ fail (printf "postgresql.parameters.%s is managed by the chart and cannot be set" $k) }}{{ end }}
{{- end }}
{{- if and .Values.backup.enabled (not .Values.backup.s3.prefix) }}{{ fail "backup.s3.prefix is required when backup.enabled is true" }}{{ end }}
{{- if and .Values.backup.enabled (not .Values.backup.s3.existingSecret) }}{{ fail "backup.s3.existingSecret is required when backup.enabled is true" }}{{ end }}
{{- if and (eq .Values.bootstrap.mode "restore") (not (or .Values.bootstrap.restore.prefix .Values.backup.enabled)) }}{{ fail "bootstrap.mode restore needs bootstrap.restore.prefix or backup.enabled" }}{{ end }}
{{- if and (not .Values.tls.certManager.enabled) (not .Values.tls.existingSecret) }}{{ fail "mutual TLS is required: enable tls.certManager or set tls.existingSecret" }}{{ end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pgha.labels" . | nindent 4 }}
data:
  postgresql.conf: |
    # Rendered by the postgres-ha chart. Change it through values; the agent
    # reloads PostgreSQL when it changes, and the pods roll for settings that
    # need a restart.
    listen_addresses = '*'
    port = 5432
    unix_socket_directories = '/var/run/postgresql'
    password_encryption = 'scram-sha-256'
    ident_file = '/etc/pgha/config/pg_ident.conf'
    ssl = on
    ssl_cert_file = '/etc/pgha/tls/tls.crt'
    ssl_key_file = '/etc/pgha/tls/tls.key'
    ssl_ca_file = '/etc/pgha/tls/ca.crt'
    ssl_min_protocol_version = 'TLSv1.2'
    wal_level = replica
    wal_log_hints = on
    hot_standby = on
    hot_standby_feedback = on
    max_wal_senders = {{ add (int .Values.replicas) 5 }}
    max_replication_slots = {{ add (int .Values.replicas) 5 }}
    wal_receiver_timeout = '15s'
    wal_sender_timeout = '15s'
    wal_retrieve_retry_interval = '2s'
    {{- if .Values.backup.enabled }}
    archive_mode = on
    archive_command = '/pgha/bin/wal-g wal-push "%p"'
    archive_timeout = '300s'
    {{- else }}
    archive_mode = off
    {{- end }}
    log_destination = 'stderr'
    logging_collector = off
    log_line_prefix = '%m [%p] %q%u@%d '
    log_checkpoints = on
    log_lock_waits = on
    log_min_duration_statement = '5s'
    {{- range $k, $v := include "pgha.parameters" . | fromJson }}
    {{ $k }} = '{{ $v | toString | replace "'" "''" }}'
    {{- end }}
    # The agent's own settings (who to follow, how to restore) come last.
    include_if_exists = '/var/lib/postgresql/data/pgdata/pgha.conf'
  pg_hba.conf: |
    # Rendered by the postgres-ha chart. TLS and SCRAM only; the Unix socket
    # maps the OS user to the database role (peer).
    local   all           pgha_monitor                       peer map=pgha_monitor
    local   all           all                                peer
    {{- range .Values.postgresql.extraHBA }}
    {{ . }}
    {{- end }}
    {{- range .Values.postgresql.allowedCIDRs }}
    hostssl replication   replicator      {{ . }}   scram-sha-256
    hostssl postgres      pgha_rewind     {{ . }}   scram-sha-256
    hostssl all           all             {{ . }}   scram-sha-256
    {{- end }}
    host    all           all             0.0.0.0/0          reject
    host    all           all             ::/0               reject
    host    replication   all             0.0.0.0/0          reject
    host    replication   all             ::/0               reject
  pg_ident.conf: |
    pgha_monitor postgres pgha_monitor
  roles.json: |
    {{- $roles := list -}}
    {{- range .Values.roles -}}
    {{- $r := dict "name" .name "passwordFile" (printf "/etc/pgha/secrets/roles/%s/password" .name) "createdb" (default false .createdb) "createrole" (default false .createrole) "inRoles" (default list .inRoles) -}}
    {{- if hasKey . "connectionLimit" }}{{ $_ := set $r "connectionLimit" (int .connectionLimit) }}{{ end -}}
    {{- $roles = append $roles $r -}}
    {{- end -}}
    {{- $dbs := list -}}
    {{- range .Values.databases -}}
    {{- $dbs = append $dbs (dict "name" .name "owner" (default "postgres" .owner) "extensions" (default list .extensions)) -}}
    {{- end }}
    {{ dict "roles" $roles "databases" $dbs "pgbouncer" .Values.pgbouncer.enabled | toJson }}
