suite: pgbouncer
templates: [pgbouncer.yaml]
set:
  postgresql.allowedCIDRs: ["10.244.0.0/16"]
tests:
  - it: uses TLS both ways and looks every role up through auth_query
    documentSelector: {path: kind, value: ConfigMap}
    asserts:
      - matchRegex:
          path: data["pgbouncer.ini"]
          pattern: '(?m)^client_tls_sslmode = require$'
      - matchRegex:
          path: data["pgbouncer.ini"]
          pattern: '(?m)^server_tls_sslmode = verify-full$'
      - matchRegex:
          path: data["pgbouncer.ini"]
          pattern: '(?m)^auth_query = SELECT usename, passwd FROM pgbouncer.get_auth\(\$1\)$'
      - matchRegex:
          path: data["pgbouncer.ini"]
          pattern: '(?m)^\* = host=RELEASE-NAME-primary\.NAMESPACE\.svc port=5432$'
  - it: drops a server connection whose traffic goes unacknowledged, so a frozen primary cannot pin clients
    documentSelector: {path: kind, value: ConfigMap}
    asserts:
      - matchRegex:
          path: data["pgbouncer.ini"]
          pattern: '(?m)^tcp_user_timeout = 10000$'
  - it: reads its login from the Secret the user names
    documentSelector: {path: kind, value: Deployment}
    set:
      credentials.pgbouncer.existingSecret: pb-secret
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: auth
            secret:
              secretName: pb-secret
              items: [{key: password, path: password}]
  - it: renders nothing when off
    set:
      pgbouncer.enabled: false
    asserts:
      - hasDocuments: {count: 0}
  - it: lets the pgbouncer_auth login use the admin console, so a new primary can drop stale connections
    documentSelector: {path: kind, value: ConfigMap}
    asserts:
      - matchRegex:
          path: data["pgbouncer.ini"]
          pattern: '(?m)^admin_users = pgbouncer_auth$'
  - it: checks readiness with a query on the admin console, not just an open port
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.exec.command[0]
          value: /bin/sh
      - matchRegex:
          path: spec.template.spec.containers[0].readinessProbe.exec.command[2]
          pattern: 'SHOW VERSION'
  - it: exposes the server-side limits as values
    documentSelector: {path: kind, value: ConfigMap}
    set:
      pgbouncer.maxDbConnections: 80
      pgbouncer.reservePoolSize: 5
      pgbouncer.serverIdleTimeout: 300
    asserts:
      - matchRegex:
          path: data["pgbouncer.ini"]
          pattern: '(?m)^max_db_connections = 80$'
      - matchRegex:
          path: data["pgbouncer.ini"]
          pattern: '(?m)^reserve_pool_size = 5$'
      - matchRegex:
          path: data["pgbouncer.ini"]
          pattern: '(?m)^server_idle_timeout = 300$'
  - it: can run a database in session mode while the rest pool by transaction
    documentSelector: {path: kind, value: ConfigMap}
    set:
      pgbouncer.sessionDatabases: [reports]
    asserts:
      - matchRegex:
          path: data["pgbouncer.ini"]
          pattern: '(?m)^reports = host=RELEASE-NAME-primary\.NAMESPACE\.svc port=5432 pool_mode=session$'
  - it: lists every chart database explicitly, so a reset after failover always finds it
    documentSelector: {path: kind, value: ConfigMap}
    set:
      databases: [{name: app, owner: app}, {name: billing, owner: app}]
    asserts:
      - matchRegex:
          path: data["pgbouncer.ini"]
          pattern: '(?m)^app = host=RELEASE-NAME-primary\.NAMESPACE\.svc port=5432$'
      - matchRegex:
          path: data["pgbouncer.ini"]
          pattern: '(?m)^billing = host=RELEASE-NAME-primary\.NAMESPACE\.svc port=5432$'
      - matchRegex:
          path: data["pgbouncer.ini"]
          pattern: '(?m)^postgres = host=RELEASE-NAME-primary\.NAMESPACE\.svc port=5432$'
