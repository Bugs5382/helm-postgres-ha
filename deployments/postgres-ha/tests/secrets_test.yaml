suite: generated credentials
templates: [secrets-job.yaml]
set:
  postgresql.allowedCIDRs: ["10.244.0.0/16"]
tests:
  - it: generates every credential once, in a hook that never overwrites
    documentSelector: {path: kind, value: Job}
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade
      - equal:
          path: spec.template.spec.containers[0].args
          value: [secrets, ensure, --spec, /etc/pgha/secrets.json]
  - it: leaves out credentials the user brings
    documentSelector: {path: kind, value: ConfigMap}
    set:
      credentials.superuser.existingSecret: mine
      roles: [{name: app, existingSecret: app-pw}]
    asserts:
      - notMatchRegex:
          path: data["secrets.json"]
          pattern: RELEASE-NAME-superuser|role-app
      - matchRegex:
          path: data["secrets.json"]
          pattern: RELEASE-NAME-replication
  - it: renders no Job when every credential is brought
    set:
      credentials:
        superuser: {existingSecret: a}
        replication: {existingSecret: b}
        rewind: {existingSecret: c}
        pgbouncer: {existingSecret: d}
      roles: [{name: app, existingSecret: e}]
    asserts:
      - hasDocuments: {count: 0}
