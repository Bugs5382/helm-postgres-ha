# Default values for postgres-ha. Every value is checked by values.schema.json.
# The defaults are production-safe: mutual TLS, NetworkPolicies, a PDB, hard
# anti-affinity and quorum synchronous replication are all on.

# -- Override the cluster name. Defaults to the release name. Every resource
# is named after it (<name>-0..N-1, <name>-primary, <name>-replica, ...).
fullnameOverride: ""

# -- Number of members. Three or more gives a quorum for failover.
replicas: 3

# -- Labels added to every resource.
commonLabels: {}

# PostgreSQL itself: the official image, pinned by digest. The chart supports
# one major per chart line (see appVersion).
image:
  # -- Registry for the PostgreSQL image.
  registry: docker.io
  # -- The official postgres image.
  repository: library/postgres
  # -- Tag. The chart supports one PostgreSQL major per chart line.
  tag: "18.6-bookworm"
  # -- Digest the tag is pinned to. Set both when you change the tag.
  digest: "sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650"
  # -- Image pull policy.
  pullPolicy: IfNotPresent

# The agent: built from this repository (pgha plus a static wal-g). An init
# container copies both into the PostgreSQL container, where pgha runs as
# PID 1 and supervises the server.
agent:
  image:
    # -- Registry for the agent image.
    registry: ghcr.io
    # -- The agent image (pgha plus a static wal-g).
    repository: bugs5382/helm-postgres-ha/pgha
    # -- Defaults to the chart version.
    tag: ""
    # -- Set a digest to pin the image.
    digest: ""
    # -- Image pull policy.
    pullPolicy: IfNotPresent
  # -- How long a Lease holder may go without renewing before others may take over.
  leaseDuration: 15s
  # -- A primary that has not renewed for this long stops PostgreSQL (fencing).
  # Must be shorter than leaseDuration minus retryPeriod.
  renewDeadline: 10s
  # -- Reconcile interval.
  retryPeriod: 2s
  # -- A standby that cannot stream from a healthy primary for this long is rewound or re-cloned.
  rejoinTimeout: 60s
  # -- How long pg_promote may take. A member that does not finish in time gives the Lease back.
  promoteTimeout: 30s
  # -- Timeout for each mutual-TLS status call to a peer.
  peerTimeout: 2s
  # -- Most WAL (bytes) a standby may be behind the last primary position and still be promoted.
  maxLagOnFailover: 1048576
  # -- Replay lag (bytes) past which a standby reports not ready. 0 turns it off.
  readyMaxLag: 67108864
  # -- Agent log level: trace, debug, info, warn or error. Use debug in development and info in staging.
  logLevel: error
  # -- Agent log format: json, or console for local runs.
  logFormat: json
  # -- OTLP/gRPC endpoint (host:port) for traces. Empty sends none.
  otlpEndpoint: ""
  # -- The tools init container (it copies ~120 MB of binaries) and the
  # credentials hook Job.
  initResources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi

# -- Secrets for pulling the images, as a list of names.
imagePullSecrets: []

storage:
  # -- Size of each member's data volume.
  size: 10Gi
  # -- Empty uses the cluster default.
  storageClassName: ""
  # -- Access modes for the data volumes.
  accessModes: [ReadWriteOnce]

# -- Resources for the postgres container (PostgreSQL and the agent). shared_buffers
# and effective_cache_size are sized from the memory limit (or request).
resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    memory: 1Gi

postgresql:
  # -- Client address ranges pg_hba.conf accepts (TLS and SCRAM only). Required:
  # set it to your pod network, for example ["10.244.0.0/16"].
  allowedCIDRs: []
  synchronous:
    # -- quorum: a commit waits for `count` of the standbys that are streaming
    # (ANY n), and for none while no standby streams. strict: a commit waits
    # even when no standby streams (writes stop rather than run unprotected).
    # off: asynchronous. The agent manages synchronous_standby_names.
    mode: quorum
    # -- Standbys a commit waits for in quorum and strict modes.
    count: 1
  # -- initdb options for a new cluster.
  initdbArgs: "--encoding=UTF8 --locale=C.UTF-8 --data-checksums"
  # -- Extra pg_hba.conf lines, placed before the final reject rules.
  extraHBA: []
  # -- postgresql.conf settings. Merged over the chart's defaults; agent-owned
  # settings (primary_conninfo, primary_slot_name, restore_command,
  # recovery_target_*) and the TLS, socket and archive settings cannot be set here.
  # shared_buffers (a quarter) and effective_cache_size (three quarters) are
  # sized from resources.limits.memory (or the request) unless set here.
  parameters:
    max_connections: "200"
    work_mem: 4MB
    maintenance_work_mem: 64MB
    wal_keep_size: 1GB
    max_slot_wal_keep_size: 4GB
    max_wal_size: 2GB

# -- Application roles. Each gets a generated password Secret
# (<name>-role-<role>) unless existingSecret names one. Fields: name;
# existingSecret and passwordKey (the Secret and its key); createdb and
# createrole; connectionLimit (-1 is no limit); inRoles (roles it is granted).
roles:
  - name: app
    existingSecret: ""
    passwordKey: password
    createdb: false
    createrole: false
    connectionLimit: -1
    inRoles: []

# -- Databases to create. Fields: name; owner (a listed role, or postgres);
# extensions (created in the database).
databases:
  - name: app
    owner: app
    extensions: []

# Built-in credentials. Generated once (<name>-<credential>) by a hook Job
# and never rewritten, unless existingSecret names your own Secret.
credentials:
  superuser:
    # -- Secret with the superuser (postgres) password. Empty generates one.
    existingSecret: ""
    # -- Key in the Secret that holds the password.
    passwordKey: password
  replication:
    # -- Secret with the replication role's password. Empty generates one.
    existingSecret: ""
    # -- Key in the Secret that holds the password.
    passwordKey: password
  rewind:
    # -- Secret with the pg_rewind role's password. Empty generates one.
    existingSecret: ""
    # -- Key in the Secret that holds the password.
    passwordKey: password
  pgbouncer:
    # -- Secret with the PgBouncer auth_query role's password. Empty generates one.
    existingSecret: ""
    # -- Key in the Secret that holds the password.
    passwordKey: password

tls:
  # -- Issue certificates with cert-manager. Required unless existingSecret is set.
  certManager:
    enabled: true
    # -- Issuer to sign with. Empty creates a self-signed CA for this release.
    issuerRef: {}
    # -- Certificate lifetime.
    duration: 2160h
    # -- How long before expiry cert-manager renews.
    renewBefore: 360h
  # -- Secret with tls.crt, tls.key and ca.crt for the members, used instead
  # of cert-manager. The certificate needs the DNS names listed in the README
  # and both serverAuth and clientAuth usages.
  existingSecret: ""
  # -- Secret with tls.crt, tls.key and ca.crt for PgBouncer when existingSecret is used.
  pgbouncerExistingSecret: ""

bootstrap:
  # -- initdb creates an empty cluster; restore restores a WAL-G backup.
  mode: initdb
  restore:
    # -- Backup name, or LATEST.
    backup: LATEST
    # -- WAL-G prefix holding the source backups (an s3 source). Empty uses
    # the cluster's own backup storage.
    prefix: ""
    # -- Where the source backups are: s3 (prefix) or file (a volume, see
    # file). Empty means s3 when prefix is set, otherwise the cluster's own
    # storage.
    source: ""
    # A file source: a volume holding a WAL-G file store, mounted read-only.
    file:
      # -- Claim holding the source. Empty uses the cluster's own backup
      # volume (backup.storage file).
      existingClaim: ""
      # -- Directory of the WAL-G store on that volume, for example the old
      # cluster's name. Required with existingClaim.
      directory: ""
    # -- Point-in-time target; set at most one.
    targetTime: ""
    # -- Recover up to this LSN.
    targetLSN: ""
    # -- Recover up to this named restore point.
    targetName: ""
    # -- Stop just before the target instead of just after it.
    targetExclusive: false

backup:
  # -- Turn on WAL archiving and scheduled base backups with WAL-G, to
  # backup.s3 or backup.file (see backup.storage).
  enabled: false
  # -- Cron schedule (UTC).
  schedule: "0 3 * * *"
  # -- standby or primary. With standby, the primary steps in after 5 minutes.
  source: standby
  # -- Full backups always kept.
  retainFull: 7
  # -- Backups newer than this many days are kept as well.
  retainDays: 14
  # -- How long one base backup may run before it is stopped.
  timeout: 6h
  # -- Where WAL-G stores base backups and WAL: s3 (backup.s3) or file (a
  # mounted volume, backup.file).
  storage: s3
  s3:
    # -- WAL-G prefix, for example s3://bucket/cluster.
    prefix: ""
    # -- S3 endpoint URL for S3-compatible storage. Empty uses AWS.
    endpoint: ""
    # -- S3 region.
    region: us-east-1
    # -- Use path-style addressing (most S3-compatible stores need it).
    forcePathStyle: false
    # -- Secret with AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY.
    existingSecret: ""
  # A volume mounted on every member and on the restore check, for
  # backup.storage file. Every member archives to it and backs up into it, so
  # with more than one member it must be shared: ReadWriteMany, or a
  # single-node cluster.
  file:
    # -- Where the backup volume is mounted.
    mountPath: /backup
    # -- Directory on the volume WAL-G writes to. Empty uses the cluster name,
    # so several releases can share one volume.
    prefix: ""
    # -- An existing PersistentVolumeClaim to use instead of the chart's.
    existingClaim: ""
    # The claim the chart creates when existingClaim is empty. It is kept when
    # the release is uninstalled, like the backups on it.
    persistence:
      # -- Size of the backup volume.
      size: 20Gi
      # -- Empty uses the cluster default.
      storageClassName: ""
      # -- Access modes for the backup volume.
      accessModes: [ReadWriteMany]
  # -- Extra WAL-G environment (WALG_*), for example compression settings.
  env: {}
  # A scheduled restore check: restore the latest base backup into a
  # throwaway server, replay the archived WAL, run a query, and record the
  # outcome on the backup Lease (pgha_backup_last_verify_ok).
  verify:
    # -- Run the scheduled restore check. Applies only when backups are on.
    enabled: true
    # -- Cron schedule (UTC) for the restore check.
    schedule: "0 5 * * *"
    # -- Database the check query runs in.
    database: postgres
    # -- Query that must succeed on the restored server.
    query: SELECT count(*) FROM pg_class
    # -- How long the restore check may run.
    timeout: 1h
    # -- Scratch space for the restored data. Empty uses storage.size.
    scratchSize: ""
    # -- Resources for the restore check Job.
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi

pgbouncer:
  # -- Run PgBouncer in front of the primary.
  enabled: true
  # -- PgBouncer replicas.
  replicas: 2
  # -- PgBouncer image, pinned by digest.
  image:
    registry: docker.io
    repository: edoburu/pgbouncer
    tag: "v1.26.0-p0"
    digest: "sha256:b17551c776ef7e5769ef80b956d20f85e2fd25dd8912d31d58f782aad495b711"
    pullPolicy: IfNotPresent
  # -- transaction pooling breaks session state (prepared statements across
  # transactions, advisory locks, LISTEN/NOTIFY); use session where needed.
  poolMode: transaction
  # -- Server connections per user and database pair.
  defaultPoolSize: 25
  # -- Most client connections each PgBouncer accepts.
  maxClientConn: 500
  # -- Most server connections per database across all users (0: no limit).
  maxDbConnections: 0
  # -- Extra server connections a pool may use when clients wait.
  reservePoolSize: 0
  # -- Seconds an idle server connection is kept.
  serverIdleTimeout: 600
  # -- Databases pooled in session mode, for clients that need session state.
  sessionDatabases: []
  # -- Resources for each PgBouncer pod.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

service:
  # -- Annotations added to the primary and replica Services.
  annotations: {}

networkPolicy:
  # -- Create NetworkPolicies for the members and PgBouncer.
  enabled: true
  # -- NetworkPolicy peers allowed to reach PostgreSQL and PgBouncer.
  allowedClients: []
  # -- Peers allowed to scrape the agent's metrics (port 8008).
  metricsFrom: []
  # -- Where the API server lives, for the agent's egress.
  apiServer:
    cidrs: ["0.0.0.0/0"]
    ports: [443, 6443]
  # -- Extra egress rules for the postgres pods (object storage, for example).
  extraEgress: []

podDisruptionBudget:
  # -- Create a PodDisruptionBudget for the members.
  enabled: true
  # -- Members a voluntary disruption may take down at once.
  maxUnavailable: 1

affinity:
  # -- hard requires one member per node; soft prefers it.
  podAntiAffinity: hard
  # -- Topology key for the anti-affinity rule.
  topologyKey: kubernetes.io/hostname
  # -- Spread members across zones when the nodes are labelled with one.
  zoneSpread: true
  # -- Extra affinity merged into the pod spec.
  extra: {}

# -- Node selector for the members.
nodeSelector: {}
# -- Tolerations for the members.
tolerations: []
# -- PriorityClass for the members.
priorityClassName: ""
# -- Grace period for a member to stop. The agent's own shutdown timeout is 10 seconds shorter.
terminationGracePeriodSeconds: 120
# -- Labels added to the member pods.
podLabels: {}
# -- Annotations added to the member pods.
podAnnotations: {}

serviceMonitor:
  # -- Create a ServiceMonitor for the agent metrics (needs the Prometheus operator).
  enabled: false
  # -- Scrape interval.
  interval: 30s
  # -- Labels added to the ServiceMonitor, for your Prometheus selector.
  labels: {}

metrics:
  # Exporters beside each member (postgres_exporter, over the local socket as
  # pgha_monitor) and each pooler (pgbouncer_exporter). The agent's own
  # metrics are always on, on port 8008.
  exporters:
    # -- Run postgres_exporter beside each member and pgbouncer_exporter beside each pooler.
    enabled: false
    postgres:
      # -- postgres_exporter image, pinned by digest.
      image:
        registry: docker.io
        repository: prometheuscommunity/postgres-exporter
        tag: v0.20.1
        digest: "sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e"
        pullPolicy: IfNotPresent
      # -- Resources for postgres_exporter.
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
    pgbouncer:
      # -- pgbouncer_exporter image, pinned by digest.
      image:
        registry: docker.io
        repository: prometheuscommunity/pgbouncer-exporter
        tag: v0.12.1
        digest: "sha256:30f31b6c2efdad3647f8182cc7c1a3a19e42bae5d17387694989f969371c230d"
        pullPolicy: IfNotPresent
      # -- Resources for pgbouncer_exporter.
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 64Mi
  # A PrometheusRule with the cluster's alerts (needs the Prometheus operator).
  prometheusRule:
    # -- Create a PrometheusRule with the cluster's alerts (needs the Prometheus operator).
    enabled: false
    # -- Labels added to the PrometheusRule, for your Prometheus selector.
    labels: {}
    # -- Replay lag, in bytes, that pages after 5 minutes.
    replicationLagBytes: 104857600
    # -- Age of the last successful base backup that pages (with backups on).
    backupMaxAgeHours: 26
    # -- Data volume use, in percent, that warns after 10 minutes.
    diskUsedPercent: 85
